<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="330" viewBox="0 0 1440 330" role="img" aria-labelledby="title">
  <title id="title">Two step quick start</title>
  <defs><style>.t{font:700 39px system-ui;fill:#fff}.num{font:800 50px system-ui;fill:#67e8f9}.n{font:700 30px system-ui;fill:#fff}.cmd{font:700 34px ui-monospace,monospace;fill:#e0f2fe}.card{fill:#16233d;stroke:#4b6b99;stroke-width:3}</style></defs>
  <rect width="1440" height="330" rx="28" fill="#0b1325"/><text x="60" y="67" class="t">Run it in two steps</text>
  <g transform="translate(40 108)"><rect class="card" width="660" height="175" rx="22"/><text x="30" y="58" class="num">1</text><text x="98" y="52" class="n">Start</text><text x="30" y="130" class="cmd">docker compose up --build -d</text></g>
  <g transform="translate(740 108)"><rect class="card" width="660" height="175" rx="22"/><text x="30" y="58" class="num">2</text><text x="98" y="52" class="n">Verify</text><text x="30" y="130" class="cmd">curl localhost:8080/health</text></g>
</svg>
