<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title">
  <title id="title">Simple data model</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#6366f1"/></marker><style>.h{font:700 35px system-ui;fill:#172033}.s{font:500 18px system-ui;fill:#64748b}.c{fill:#fff;stroke:#c7d2fe;stroke-width:3}.n{font:700 24px system-ui;fill:#312e81}.f{font:500 17px system-ui;fill:#475569}.l{stroke:#6366f1;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="480" rx="28" fill="#f8fafc"/>
  <text x="60" y="64" class="h">One task, multiple attempts, measurable improvement</text><text x="60" y="98" class="s">Explicit RETRY / REFINE relationships keep the analytics trustworthy.</text>
  <g transform="translate(75 165)"><rect class="c" width="245" height="205" rx="20"/><text x="28" y="48" class="n">Session</text><text x="28" y="90" class="f">goal</text><text x="28" y="123" class="f">created_at</text><text x="28" y="170" class="s">one user task</text></g>
  <g transform="translate(430 165)"><rect class="c" width="275" height="205" rx="20"/><text x="28" y="48" class="n">Prompt Run</text><text x="28" y="90" class="f">sequence · interaction</text><text x="28" y="123" class="f">prompt · response</text><text x="28" y="156" class="f">tokens · latency · cost</text></g>
  <g transform="translate(815 165)"><rect class="c" width="245" height="205" rx="20"/><text x="28" y="48" class="n">Evaluation</text><text x="28" y="90" class="f">quality_score</text><text x="28" y="123" class="f">accepted</text><text x="28" y="156" class="f">reason</text></g>
  <g transform="translate(1170 165)"><rect class="c" width="210" height="205" rx="20"/><text x="28" y="48" class="n">Metrics</text><text x="28" y="90" class="f">total tokens</text><text x="28" y="123" class="f">retry waste</text><text x="28" y="156" class="f">efficiency</text></g>
  <path class="l" d="M320 267H420"/><path class="l" d="M705 267H805"/><path class="l" d="M1060 267H1160"/>
