name: prompt-analyzer

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prompt_analyzer
      POSTGRES_USER: prompt
      POSTGRES_PASSWORD: prompt
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt -d prompt_analyzer"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://prompt:prompt@postgres:5432/prompt_analyzer
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres_data:
